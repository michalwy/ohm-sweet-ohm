name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # By hand, or from `release.yml` (#249). A tag created with `GITHUB_TOKEN` starts no `push` run, so
  # the release workflow dispatches this one on the tag with `publish_image`; a manual run leaves it
  # off and does not rebuild a shipped release's image.
  workflow_dispatch:
    inputs:
      publish_image:
        description: "On a v* tag: build and publish the container image (the release workflow sets it)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://oso:oso_e2e_password@localhost:5433/ohm_sweet_ohm_e2e?schema=public
  BETTER_AUTH_URL: http://127.0.0.1:3100
  BETTER_AUTH_SECRET: ohm-sweet-ohm-ci-auth-secret-value

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run unit tests
        run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oso
          POSTGRES_PASSWORD: oso_e2e_password
          POSTGRES_DB: ohm_sweet_ohm_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U oso -d ohm_sweet_ohm_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Run integration tests
        run: pnpm exec tsx --tsconfig tests/integration/tsconfig.json --test 'tests/integration/**/*.test.ts'

  closing-references:
    name: Closing reference check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Check for closing keywords in PR body and commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-closing-references.sh

  # The release image is built natively per architecture — no QEMU (the owner, 2026-11-24, #259).
  # Each leg builds its platform on a runner of that architecture and pushes it by digest only;
  # `Publish container image` then joins the digests into one multi-arch manifest list and tags it.
  # `release.yml` reads that job's conclusion as "the image is published", so it keeps the name.
  build-image:
    name: Build container image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [static-checks, unit, integration]
    # Publish images only for release tags (vX.Y.Z), never for every main commit
    # (e.g. Renovate) or pull requests: the tag's push, or the release workflow's
    # dispatch on it (#249).
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image))

    strategy:
      # One failed leg already fails the release; let the other finish so its log is complete.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          # GitHub's native arm64 runner, free for public repositories.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels and the version for OSO_VERSION; the tags are applied by the merge job.
      - name: Compute image labels and version
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push ${{ matrix.platform }} by digest
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OSO_VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.slug }}
          cache-to: type=gha,scope=image-${{ matrix.slug }},mode=max

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the build produced no digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4.6.2
        with:
          name: image-digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [build-image]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image))

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest=true tags the release as :latest (deployments track :latest).
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Create and push the multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          count=$(ls | wc -l)
          [ "$count" -eq 2 ] || { echo "::error::expected 2 digests (amd64, arm64), found $count"; exit 1; }
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "$IMAGE_NAME@sha256:%s " *)

      # Provenance attestations sit in the list as unknown/unknown entries; only the images count.
      - name: Check the published image covers both architectures
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION"
          platforms=$(docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')
          [ "$platforms" = "linux/amd64,linux/arm64" ] \
            || { echo "::error::manifest list has [$platforms], expected linux/amd64,linux/arm64"; exit 1; }
