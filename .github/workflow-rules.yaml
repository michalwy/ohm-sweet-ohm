# What this project implements of the estate's workflow rules.
#
# Format: dev-agent's rules/ADOPTION.md. dev-agent generates rules/INDEX.md from
# this file rather than from its own reading of this repository, so this file is
# a claim about `main` and R-002 applies to it: every status below was checked
# against the merged file, not from recollection.
#
# Update it in the same commit that implements or diverges from a rule.

schema: 1
project: ohm-sweet-ohm
updated: 2026-09-07

rules:
  R-001:
    status: implemented
    where: "AGENTS.md § Working Rules"
    note: >-
      Enforced rather than remembered: CI job "Closing reference check" runs
      scripts/check-closing-references.sh over both the pull request body and
      every commit message in the branch.

  R-002:
    status: implemented
    where: "AGENTS.md § Branching, Pull Requests, and Merging"

  R-003:
    status: implemented
    where: "AGENTS.md § Branching, Pull Requests, and Merging"
    note: >-
      Written with its holds-when, not as merge etiquette: with
      required_approving_review_count 0 and require_last_push_approval false
      there is no approval for a later push to invalidate, so re-reading the
      head is the only protection against merging a commit nobody verified.

  R-004:
    status: implemented
    where:
      - "scripts/check-ruleset-drift.sh"
      - "AGENTS.md § Branching, Pull Requests, and Merging"
    note: >-
      The drift check reports three outcomes rather than two. When a field is
      unreadable it names it, refuses to normalise absent to empty, exits 2 so a
      partial run never reports success, and --write refuses to produce an
      artifact missing it.

  R-005:
    status: partial
    gap: >-
      The second half is implemented: where the record lives is decided,
      dated and reasoned — plans kept but narrowed, because a plan under
      .claude/ is gitignored and dies with the worktree while the durable
      record is the pull request and the issue. The first half, which the card
      calls universal, is not: this project asks for a plan only when work
      cannot be finished in one session, so a task that spans several areas but
      fits in one session records no shape before writing. Narrower than the
      card, deliberately, and not yet reconciled with it.
    where: "AGENTS.md § Multi-Step Implementation Plans"

  R-006:
    status: implemented
    where: "AGENTS.md § Testing Direction"
    note: >-
      Browser verification is stated as deliberately out of the definition of
      done, with the date, the reason, and an explicit instruction not to "fix"
      it back. The card requires that a position be recorded, not which one;
      D-001 in dev-agent's registry records that this answer differs from
      darkroom's, which is not a divergence from the rule.

  R-007:
    status: partial
    gap: >-
      The artifact and the check exist, but coverage depends on who runs the
      check. GITHUB_TOKEN reads the ruleset in a reduced view without
      bypass_actors, so the scheduled run does not verify "no bypass for
      anyone" — the clause the gate exists for. Complete when run with owner
      rights. Closing it needs a RULESET_TOKEN secret, which is the owner's
      action because it is a credential.
    where: "AGENTS.md § Branching, Pull Requests, and Merging"
    note: >-
      Artifact at .github/rulesets/main.json, derived here rather than copied.
      scripts/check-ruleset-drift.sh compares and exits 1 with a diff; it runs
      daily on a schedule and advisory on pull requests touching the artifact,
      per dev-agent decisions/0003 — never a required context.

  R-008:
    status: implemented
    where: "AGENTS.md § Session Model"

  R-009:
    status: implemented
    where: "AGENTS.md § Session Model"

  R-010:
    status: partial
    gap: >-
      Both known divergences are now stated where the rule that names the
      command is: the drift check's identity-dependent coverage, and pnpm lint
      reporting 93 errors locally against zero in CI. Stated, not eliminated —
      the lint divergence is a three-line eslint.config.mjs change that sits
      with the owner, and the card is explicit that a divergence is a defect in
      the check rather than a quirk to work around.
    where:
      - "AGENTS.md § Testing Direction"
      - "AGENTS.md § Branching, Pull Requests, and Merging"

  R-011:
    status: implemented
    where: "AGENTS.md § Session Model"

  R-012:
    status: implemented
    where: "AGENTS.md § Session Model"
    note: >-
      Agent memory for this project is machine-local and outside git; four
      entries were reconciled on 2026-09-07 when main was protected. The
      delegation of process authority to dev-agent is also recorded there,
      marked as superseding the handover chip a fresh lead inherits.
