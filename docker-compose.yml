services:
  app:
    build:
      context: .
      target: runner
    command: sh -c "pnpm prisma:migrate:deploy && pnpm start"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oso}:${POSTGRES_PASSWORD:-oso_dev_password}@db:5432/${POSTGRES_DB:-ohm_sweet_ohm}?schema=public
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-ohm-sweet-ohm-local-development-auth-secret}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ohm_sweet_ohm}
      POSTGRES_USER: ${POSTGRES_USER:-oso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oso_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oso -d ohm_sweet_ohm"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: runner
    command: pnpm worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oso}:${POSTGRES_PASSWORD:-oso_dev_password}@db:5432/${POSTGRES_DB:-ohm_sweet_ohm}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
