services:
  db-e2e:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ohm_sweet_ohm_e2e
      POSTGRES_USER: oso
      POSTGRES_PASSWORD: oso_e2e_password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oso -d ohm_sweet_ohm_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15
